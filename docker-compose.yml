services:
  function:
    build:
      context: .
      target: run
      args:
        VERSION_PREFIX: 1.0.0.0
        VERSION_SUFFIX: docker
    ports:
      - "7350:8080"
    environment:
      Database__SeedSampleData: "true"
      Serilog__MinimumLevel__Default: "Debug"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      - otel-collector
  otel-collector:
    image: otel/opentelemetry-collector:0.164.0
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "7353:4317"
      - "7354:4318"
    depends_on:
      - aspire-dashboard
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.2
    ports:
      - "7352:18888"
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
