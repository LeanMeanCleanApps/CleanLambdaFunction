name: Feature request
description: Suggest an improvement to the template or the solutions it creates.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Good ideas are always welcome, and so are the strange ones.

        This template is one of five that share their Application and Infrastructure layers, so an idea for those layers lands in all five. That's a feature, not a bug, but it does mean it helps to know which layers your idea touches. The aim is lean: a feature that every user would have to delete is a hard sell.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? For example, "I'm always frustrated when ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you've thought about, including "live with it", which is always on the table.
  - type: dropdown
    id: scope
    attributes:
      label: Which layers does it affect?
      multiple: true
      options:
        - Presentation (this template only)
        - Application (all five templates)
        - Infrastructure (all five templates)
        - Tests
        - Build pipeline or repository setup
        - Agent skills
        - Documentation
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes, I'd like to open a pull request"
        - "No, I'm just here for the ideas"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this hasn't been suggested yet.
          required: true
        - label: I agree to follow this project's [code of conduct](https://github.com/LeanMeanCleanApps/CleanLambdaFunction/blob/main/CODE_OF_CONDUCT.md).
          required: true
