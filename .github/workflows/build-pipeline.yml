name: Build Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Maintenance build on the 15th, after Dependabot's monthly pull request.
    - cron: "17 9 15 * *"
      timezone: "America/Chicago"
    # Monthly release on the 1st. Off the hour, because GitHub delays more runs at :00.
    - cron: "17 9 1 * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      run:
        description: Which monthly run to rehearse or trigger
        type: choice
        options: [release, maintenance]
        default: release
      dry-run:
        description: Rehearse only. Packs and logs in to NuGet, but publishes nothing
        type: boolean
        default: true
      force:
        description: Release even if only .github/ has changed since the last release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COVERAGE_THRESHOLD: 95
  TEMPLATE_MAX_SIZE: 1048576

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      name: ${{ steps.initialize.outputs.name }}
      version: ${{ steps.initialize.outputs.version }}
      version_prefix: ${{ steps.initialize.outputs.version_prefix }}
      version_suffix: ${{ steps.initialize.outputs.version_suffix }}
      package_size: ${{ steps.pack.outputs.size }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Initialize
        id: initialize
        run: |
          NAME=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          VERSION_PREFIX=$(date +'%Y.%m.%d').${GITHUB_RUN_NUMBER}
          VERSION_SUFFIX=""

          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            VERSION_SUFFIX="pr-${PR_NUMBER}"
          fi

          VERSION=$VERSION_PREFIX${VERSION_SUFFIX:+-$VERSION_SUFFIX}

          {
            echo "name=$NAME"
            echo "version_prefix=$VERSION_PREFIX"
            echo "version_suffix=$VERSION_SUFFIX"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash

      - name: Setup .NET
        id: setup
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Format
        id: format
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build
        id: build
        run: |
          docker build . \
            --target run \
            --tag "$NAME:$VERSION" \
            --build-arg VERSION_PREFIX="$VERSION_PREFIX" \
            --build-arg VERSION_SUFFIX="$VERSION_SUFFIX"
          docker save "$NAME:$VERSION" --output image.tar
        env:
          DOCKER_BUILDKIT: 1
          NAME: ${{ steps.initialize.outputs.name }}
          VERSION: ${{ steps.initialize.outputs.version }}
          VERSION_PREFIX: ${{ steps.initialize.outputs.version_prefix }}
          VERSION_SUFFIX: ${{ steps.initialize.outputs.version_suffix }}

      - name: Pack
        id: pack
        run: |
          dotnet pack template/template.csproj -p:PackageVersion="$VERSION" --configuration Release --output packages
          SIZE=$(stat --format=%s packages/*.nupkg)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Template package is $SIZE bytes"
          if [ "$SIZE" -gt "$TEMPLATE_MAX_SIZE" ]; then
            echo "::error::Template package is $SIZE bytes, over the $TEMPLATE_MAX_SIZE byte limit"
            exit 1
          fi
        env:
          VERSION: ${{ steps.initialize.outputs.version }}
        shell: bash

      - name: Test Pipeline Report
        id: test-report
        run: python3 -m unittest discover --start-directory .github/workflows/pipeline-report --verbose

      - name: Upload Image
        id: upload-image
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar
          retention-days: 1

      - name: Upload Template
        id: upload-template
        uses: actions/upload-artifact@v7
        with:
          name: template
          path: packages/*.nupkg
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    outputs:
      tests: ${{ steps.report.outputs.tests }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Test
        id: test
        run: |
          docker build . \
            --target results \
            --output type=local,dest=results \
            --build-arg VERSION_PREFIX="$VERSION_PREFIX" \
            --build-arg VERSION_SUFFIX="$VERSION_SUFFIX"
        env:
          DOCKER_BUILDKIT: 1
          VERSION_PREFIX: ${{ needs.build.outputs.version_prefix }}
          VERSION_SUFFIX: ${{ needs.build.outputs.version_suffix }}

      - name: Report
        id: report
        run: python3 .github/workflows/pipeline-report/report.py test --results results

      - name: Upload Results
        id: upload-results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            results/*.trx
            results/coverage.opencover.xml
            results/exit-code
          retention-days: 7

      - name: Setup .NET
        id: setup
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Template
        id: download-template
        uses: actions/download-artifact@v8
        with:
          name: template
          path: packages

      - name: Verify Template
        id: verify-template
        run: |
          dotnet new install packages/*.nupkg
          dotnet new "$(jq -r .shortName .template.config/template.json)" --name Template.Verification --output verification
          dotnet test verification --configuration Release
          echo "### Template" >> "$GITHUB_STEP_SUMMARY"
          echo "The packed template installs, and the generated solution builds and passes its tests." >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: test
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "csharp"]

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Initialize
        id: initialize
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Analysis
        id: analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  dependencies:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write

    outputs:
      vulnerable: ${{ steps.review.outputs.vulnerable-changes }}
      licences: ${{ steps.review.outputs.invalid-license-changes }}

    steps:
      - name: Review
        id: review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause
          comment-summary-in-pr: on-failure
          show-openssf-scorecard: false

  scan:
    name: Container Scan
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Download Image
        id: download
        uses: actions/download-artifact@v8
        with:
          name: image

      - name: Load Image
        id: load
        run: docker load --input image.tar

      - name: Scan Image
        id: scan-image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.name }}:${{ needs.build.outputs.version }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Scan Config
        id: scan-config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          skip-setup-trivy: true

      - name: Upload Image Scan
        id: upload-image-scan
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy

      - name: Upload Config Scan
        id: upload-config-scan
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Enforce Image Findings
        id: enforce-image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.name }}:${{ needs.build.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1
          skip-setup-trivy: true

      - name: Enforce Config Findings
        id: enforce-config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          exit-code: 1
          skip-setup-trivy: true

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [build, test, analysis, dependencies, scan]
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: read

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/pipeline-report
            .trivyignore
          sparse-checkout-cone-mode: false

      - name: Download Results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: results

      - name: Report
        id: report
        run: python3 .github/workflows/pipeline-report/report.py summary --results results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  release:
    name: Release Check
    runs-on: ubuntu-latest
    needs: summary
    # Only once the Summary has passed. Real releases come from main on the 1st or a manual run;
    # dry runs can come from any branch.
    if: >-
      ${{ github.repository_owner == 'LeanMeanCleanApps' && (
        (github.ref == 'refs/heads/main' && github.event.schedule == '17 9 1 * *') ||
        (github.event_name == 'workflow_dispatch' && inputs.run == 'release' && (inputs.dry-run || github.ref == 'refs/heads/main'))
      ) }}
    permissions:
      contents: read

    outputs:
      publish: ${{ steps.check.outputs.publish }}
      dry-run: ${{ steps.check.outputs.dry-run }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Changes
        id: check
        run: |
          LATEST=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)

          if [[ -z "$LATEST" ]]; then
            echo "No previous release"
            PUBLISH=true
          elif [[ "$FORCE" == 'true' ]]; then
            echo "Forced release"
            PUBLISH=true
          elif git diff --quiet "$LATEST" HEAD -- . ':(exclude).github'; then
            echo "Nothing outside .github/ has changed since $LATEST, skipping the release"
            PUBLISH=false
          else
            echo "Changes since $LATEST:"
            git diff --stat "$LATEST" HEAD -- . ':(exclude).github'
            PUBLISH=true
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "dry-run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release Check"
            echo "Latest release: ${LATEST:-none}. Publish: $PUBLISH. Dry run: ${DRY_RUN:-false}."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry-run }}
        shell: bash

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build, summary, release]
    if: ${{ !cancelled() && needs.summary.result == 'success' && needs.release.outputs.publish == 'true' }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Download Template
        id: download-template
        uses: actions/download-artifact@v8
        with:
          name: template
          path: packages

      - name: Login to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Release Notes
        id: notes
        run: |
          if [[ "$EVENT" == 'schedule' ]]; then
            NOTES="Monthly release for $(date +'%B %Y'). The template is released on the 1st of each month with every change merged since the previous release."
          else
            NOTES="Out-of-cycle release. The template is normally released on the 1st of each month with every change merged since the previous release."
          fi
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          {
            echo "### Publish${DRY_RUN:+ (dry run)}"
            echo "Package: \`$(basename packages/*.nupkg)\`"
            echo "Release: \`$VERSION\`"
            echo
            echo "$NOTES"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.build.outputs.version }}
          DRY_RUN: ${{ needs.release.outputs.dry-run == 'true' && 'yes' || '' }}
        shell: bash

      - name: Attest
        id: attest
        if: ${{ needs.release.outputs.dry-run != 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: packages/*.nupkg

      - name: NuGet Push
        id: nuget-push
        if: ${{ needs.release.outputs.dry-run != 'true' }}
        run: dotnet nuget push packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$API_KEY" --skip-duplicate
        env:
          API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: GitHub Release
        id: github-release
        if: ${{ needs.release.outputs.dry-run != 'true' }}
        run: gh release create "$VERSION" packages/*.nupkg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes "$NOTES" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
        shell: bash
